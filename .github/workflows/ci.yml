name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build smoke test
        run: npm run build
      - name: Generated files must be committed and drift-free
        run: git diff --exit-code -- service-areas locations.html sitemap.xml
