name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.js dates the sitemap from the last commit touching the
          # content inputs. The default shallow checkout has no history to
          # read, so it fell back to the merge commit's own date.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build smoke test
        run: npm run build
      # The whole tree, not just service-areas/locations/sitemap: the build
      # also stamps the asset hash onto every root page, and that was outside
      # the old path list. Editing styles.css without rebuilding therefore
      # left index.html and the service pages pointing at a stale ?v= while
      # CI stayed green — reintroducing the exact stale-CSS problem the
      # stamping was added to prevent. `npm run build` writes nothing else,
      # so a clean tree afterwards is the right invariant.
      - name: Generated files must be committed and drift-free
        run: git diff --exit-code
